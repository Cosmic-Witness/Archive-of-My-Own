# Runs the unit tests on every pull request and on pushes to main.
# They check that a sync never overwrites hand edits, that private repos never leak into content/projects.yaml,
# that thumbnails stay in the house style, and that the committed index.html matches content/projects.yaml.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
