  - id: Stryder
    section: projects
    section_status: proposed
    title: Stryder
    blurb: >-
      My question was whether a small neural network can learn to undo a messy cipher from examples
      alone. Each letter of a word is encrypted by a randomly chosen scheme out of five (shift, XOR,
      substitution, Base64 and bit reversal), and an LSTM encoder and decoder learns to turn the
      ciphertext back into the word. The detail that makes it learnable is the seed: every word's
      randomness comes from one of only twenty seeds, which gives the network some structure to find.
      In the notebook, the training loss falls from 1.76 to 0.004 over 100 epochs.
    blurb_status: draft
    built_with: Python, PyTorch, Weights & Biases
    links: []
    thumb: thumbs/Stryder.svg
