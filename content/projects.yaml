# Everything the site shows lives in this file. Edit it, then run:  python scripts/build.py
#
# The build refreshes the `github:` block of every entry from GitHub and never touches the rest.
# So these fields are yours, and are never overwritten by a sync:
#   title, section, section_status, blurb, blurb_status, built_with, links, thumb, thumb_alt, order, hidden
# and everything under site:, about:, sections: and force_include:.
#
# How to
#   Edit a blurb        change `blurb:` (blank line = new paragraph; [text](url) and **bold** work),
#                       then set `blurb_status: final` to remove the "[draft]" mark from the page.
#   Move a repo         change `section:` to projects, writing or fun; set `section_status: confirmed`.
#   Change the order    give entries `order: 1`, `order: 2`, ... Lower comes first, within a section.
#                       Entries without `order` follow: pinned repos first (needs GITHUB_TOKEN when you
#                       build), then most recently pushed.
#   Hide an entry       `hidden: true`.   Show a repo listed under `excluded:`  add its name to
#                       `force_include:` and rebuild.
#   Switch the font     `site.font:` paper | terminal | mixed.
#   Swap a thumbnail    save your own SVG or PNG as thumbs/<name>.svg (or point `thumb:` at any file).
#   Add a Writing entry copy the example below into `entries:` and fill it in.
#
#   - id: my-first-note            # any unique word, no spaces
#     section: writing
#     title: A Short Note on Something
#     blurb: Two to five sentences, in your own voice.
#     blurb_status: final
#     links:
#       - {label: Paper, url: "https://example.org/my-note.pdf"}
#     thumb: thumbs/my-first-note.svg   # run: python scripts/thumbs.py --name my-first-note
#     thumb_alt: A short description of the picture, for screen readers.
#
# [TODO] marks things only you can fill in. Search this file and the page for it.
#
